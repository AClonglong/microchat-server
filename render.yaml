services:
  - type: web
    name: microchat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # 免费版；升级到 starter 即不再休眠
    region: singapore     # 离中国最近；可选 oregon / frankfurt / ohio
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: MICROCHAT_SECRET
        generateValue: true   # Render 自动生成并固定，重启不会踢掉已登录用户
      - key: DATABASE_URL
        fromDatabase:
          name: microchat-db
          property: connectionString
      - key: DATA_DIR
        value: /tmp/microchat

databases:
  - name: microchat-db
    plan: free            # 免费 Postgres：30 天后过期（会提前发邮件提醒）
    region: singapore
    databaseName: microchat
    user: microchat
